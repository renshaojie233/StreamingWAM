# @package _global_

# Equal-budget FastWAM-Joint continuation used by the paper. This branch starts
# from the same stage-one checkpoint as StreamingWAM and keeps ordinary
# shared-timestep Joint training for another 40,000 optimization steps.
defaults:
  - override /data: libero_2cam
  - override /model: fastwam_joint
  - _self_

batch_size: 2
num_workers: 8

model:
  mot_checkpoint_mixed_attn: false
  num_history_frames: 1
  action_clean_prefix_steps: 0
  sdp_future_action_train_prob: 0.0

data:
  train:
    pretrained_norm_stats: assets/libero_dataset_stats.json
    num_frames: 33
    num_history_frames: 1
    future_action_horizon: 32
    action_clean_prefix_steps: 0

lr_scheduler_type: cosine
lr_scheduler_total_steps: 60000
lr_warmup_ratio: 0.0
learning_rate: 1.0e-4
num_epochs: 100
max_steps: 60000
log_every: 10
save_every: 2000
eval_every: 200

# 2 samples/rank x 8 accumulation x 4 ranks = 64 global batch.
gradient_accumulation_steps: 8
weight_decay: 1.0e-2
mixed_precision: bf16
seed: 42
resume: null
