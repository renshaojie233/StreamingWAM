# @package _global_

# Exact training protocol for the reported LIBERO-Plus StreamingWAM checkpoint.
defaults:
  - override /data: libero_2cam
  - override /model: fastwam_joint
  - _self_

batch_size: 2
num_workers: 8

model:
  mot_checkpoint_mixed_attn: false
  num_history_frames: 5
  action_clean_prefix_steps: 16
  sdp_future_action_train_prob: 0.8
  sdp_future_action_steps_choices: [1, 2, 4, 8]
  sdp_future_num_noise_levels: 32
  sdp_future_random_offset: true

data:
  train:
    pretrained_norm_stats: assets/libero_dataset_stats.json
    num_frames: 17
    history_frame_stride: 1
    num_history_frames: ${model.num_history_frames}
    future_action_horizon: 16
    action_clean_prefix_steps: ${model.action_clean_prefix_steps}

lr_scheduler_type: cosine
learning_rate: 1.0e-4
num_epochs: 100
max_steps: 60000
log_every: 10
save_every: 2000
eval_every: 200

gradient_accumulation_steps: 8
weight_decay: 1.0e-2
mixed_precision: bf16
seed: 42
resume: null
