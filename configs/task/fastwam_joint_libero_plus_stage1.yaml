# @package _global_

# First stage of the released two-stage LIBERO / LIBERO-Plus protocol.
# This trains the ordinary shared-timestep FastWAM-Joint model for 34,720
# optimization steps. The two-stage launcher transfers its weights into the
# StreamingWAM configuration and starts a fresh stage-two optimizer/scheduler.
defaults:
  - override /data: libero_2cam
  - override /model: fastwam_joint
  - _self_

batch_size: 2
num_workers: 8

model:
  mot_checkpoint_mixed_attn: false
  num_history_frames: 1
  action_clean_prefix_steps: 0
  sdp_future_action_train_prob: 0.0

data:
  train:
    pretrained_norm_stats: assets/libero_dataset_stats.json
    num_frames: 33
    num_history_frames: 1
    future_action_horizon: 32
    action_clean_prefix_steps: 0

lr_scheduler_type: cosine
lr_scheduler_total_steps: 34720
lr_warmup_ratio: 0.05
learning_rate: 1.0e-4
num_epochs: 100
max_steps: 34720
log_every: 10
save_every: 2000
eval_every: 200

# 2 samples/rank x 10 accumulation x 4 ranks = 80 global batch.
gradient_accumulation_steps: 10
weight_decay: 1.0e-2
mixed_precision: bf16
seed: 42
resume: null
